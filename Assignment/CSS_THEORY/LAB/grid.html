<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3x3 Product Cards Grid</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 2rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card h3 {
            margin: 0.5rem 0;
            font-size: 1.2rem;
        }

        .card p {
            color: #555;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>

    <h1>Product Catalog</h1>
    <div class="grid-container">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="Product 1">
            <h3>Product 1</h3>
            <p>$10.00</p>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="Product 2">
            <h3>Product 2</h3>
            <p>$12.00</p>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=1099&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="Product 3">
            <h3>Product 3</h3>
            <p>$15.00</p>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?q=80&w=2080&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Product 4">
            <h3>Product 4</h3>
            <p>$18.00</p>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1491637639811-60e2756cc1c7?q=80&w=1928&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Product 5">
            <h3>Product 5</h3>
            <p>$20.00</p>
        </div>
        <div class="card">
            <img src="https://images.pexels.com/photos/4158/apple-iphone-smartphone-desk.jpg?_gl=1*1ca5cdj*_ga*MTkwMDc1NjQ4My4xNzUwOTIzOTUy*_ga_8JE65Q40S6*czE3NTUxNDg4MTYkbzIkZzEkdDE3NTUxNDg4MjUkajUxJGwwJGgw" alt="Product 6">
            <h3>Product 6</h3>
            <p>$25.00</p>
        </div>
        <div class="card">
            <img src="https://cdn.jiostore.online/v2/jmd-asp/jdprod/wrkr/products/pictures/item/free/original/cttyPbNS-q-iphone-14-plus-productred-pdp-image-493177776-i-1-1200wx1200h.jpeg" alt="Product 7">
            <h3>Product 7</h3>
            <p>$30.00</p>
        </div>
        <div class="card">
            <img src="https://cdn.mos.cms.futurecdn.net/qp6bL8iHbt56FBJ3WfZHH3-1280-80.jpg.webp" alt="Product 8">
            <h3>Product 8</h3>
            <p>$35.00</p>
        </div>
        <div class="card">
            <img src="https://ptron.in/cdn/shop/products/ACCGH5Z9QWFAE8RY_00.jpg?v=1678036198" alt="Product 9">
            <h3>Product 9</h3>
            <p>$40.00</p>
        </div>
    </div>

</body>

</html>
